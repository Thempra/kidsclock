<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14161a">
<title>Casa</title>
<style>
:root{
  --bg:#14161a; --fg:#eceae6; --muted:#9a948c;
  --accent-house:#2dd4bf; --accent-clock:#fb923c;
  --accent-music:#1ed760;
  --accent-robot:#f9a8d4;

  /* Teclas 3D del menú: una sola geometría y una sola luz para las cuatro. */
  --key-r:36px;           /* radio exterior */
  --key-side:5px;         /* canto visible a los lados */
  --key-depth:18px;       /* canto visible abajo */
  --key-press:11px;       /* recorrido al pulsar */
  --key-ink:#080b0f;      /* texto sobre la cara iluminada */
  --key-cast:rgba(2,4,7,.85);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

header{
  position:relative;
  z-index:2;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  padding:28px 36px 0;
  flex:0 0 auto;
}
.brand h1{
  font-size:34px;
  font-weight:650;
  letter-spacing:-0.02em;
  line-height:1.1;
}
.brand p{
  margin-top:6px;
  font-size:16px;
  color:var(--muted);
}
.clock{
  text-align:right;
}
.clock time{
  display:block;
  font-size:46px;
  font-weight:600;
  letter-spacing:-0.03em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.clock span{
  display:block;
  margin-top:6px;
  font-size:15px;
  color:var(--muted);
  text-transform:capitalize;
}

/* --- Tablero de teclas 3D sobre la rejilla fija del kiosco 1280x800.
  Las cuatro comparten geometría y luz; solo cambia el tono (--tint).
  La rejilla ocupa todo el tablero: dos columnas y dos filas iguales que
  se reparten 1280x800 menos el relleno (124px arriba por la cabecera,
  12px a la izquierda) y la separación de 48px. Cada tecla queda en
  610x314. Centros clicables: (317,281) (927,281) (317,643) (927,643). --- */
main{
  position:fixed;
  left:0;
  top:0;
  width:1280px;
  height:800px;
  z-index:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  column-gap:48px;
  row-gap:48px;
  padding:124px 12px 12px 12px;
  pointer-events:none;
}
main::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(58% 60% at 46% 46%,rgba(255,255,255,.05),transparent 72%);
  pointer-events:none;
}

.card{
  position:relative;
  pointer-events:auto;
  width:100%;
  height:100%;
  border-radius:var(--key-r);
  text-decoration:none;
  color:var(--key-ink);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  /* Canto: pared de la tecla, misma caída de luz en las cuatro. */
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--tint) 46%,#0a0d12) 0%,
    color-mix(in srgb,var(--tint) 66%,#0b0e13) 58%,
    color-mix(in srgb,var(--tint) 34%,#06080a) 100%);
  box-shadow:
    inset 2px 0 0 rgba(255,255,255,.13),
    inset -2px 0 0 rgba(255,255,255,.09),
    0 30px 46px -18px var(--key-cast),
    0 12px 18px -8px rgba(0,0,0,.72),
    0 2px 3px rgba(0,0,0,.5);
  transition:box-shadow .08s ease;
}

/* Cara superior: la tecla propiamente dicha, iluminada desde arriba-izquierda. */
.cap{
  position:absolute;
  inset:0 var(--key-side) var(--key-depth);
  border-radius:calc(var(--key-r) - 5px);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  padding:0 28px;
  background:
    radial-gradient(130% 150% at 14% -18%,rgba(255,255,255,.55),rgba(255,255,255,0) 56%),
    linear-gradient(178deg,
      color-mix(in srgb,var(--tint) 58%,#fff) 0%,
      color-mix(in srgb,var(--tint) 88%,#fff) 42%,
      color-mix(in srgb,var(--tint) 80%,#000) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.9),
    inset 3px 0 0 rgba(255,255,255,.42),
    inset -3px 0 0 rgba(255,255,255,.26),
    inset 0 -14px 22px -8px rgba(0,0,0,.34),
    0 1px 0 rgba(0,0,0,.5);
  transform:translateY(0);
  transition:transform .08s ease,box-shadow .08s ease,filter .08s ease;
  will-change:transform;
}

/* Con puntero fino la tecla se eleva un poco más al acercarse; en táctil
   no hay hover y el estado de reposo queda plano. */
@media (hover:hover) and (pointer:fine){
  .card:not(:active):hover .cap{transform:translateY(-3px)}
  .card:not(:active):hover{
    box-shadow:
      inset 2px 0 0 rgba(255,255,255,.16),
      inset -2px 0 0 rgba(255,255,255,.11),
      0 36px 54px -18px var(--key-cast),
      0 16px 22px -8px rgba(0,0,0,.72),
      0 2px 3px rgba(0,0,0,.5);
  }
}

/* Recorrido: el casquete baja dentro de su canto, la cara pierde altura y
   la sombra proyectada se acorta. Así se siente el "clic" mecánico. */
.card:active .cap{
  transform:translateY(var(--key-press));
  filter:brightness(.96) saturate(1.08);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.62),
    inset 0 -8px 14px -6px rgba(0,0,0,.42);
}
.card:active{
  box-shadow:
    inset 2px 0 0 rgba(255,255,255,.1),
    inset -2px 0 0 rgba(255,255,255,.07),
    0 8px 12px -8px var(--key-cast),
    0 3px 5px -1px rgba(0,0,0,.6);
}
.card:focus-visible{
  outline:3px solid color-mix(in srgb,var(--tint) 55%,#fff);
  outline-offset:8px;
}

/* La etiqueta manda: enorme, oscura sobre la cara iluminada y legible
   desde el otro lado de la habitación. El icono solo acompaña. */
.cap svg{
  width:96px;
  height:96px;
  flex:0 0 auto;
  opacity:.8;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.45));
}
.cap .label{
  font-size:66px;
  font-weight:800;
  letter-spacing:-0.035em;
  line-height:1;
  color:var(--key-ink);
  text-shadow:0 1px 0 rgba(255,255,255,.4),0 -1px 0 rgba(0,0,0,.14);
}

/* "Robot de Limpieza" no cabe en una línea a 66px junto al icono dentro de
   una tecla de 610px: se reparte en dos líneas a 54px, conservando peso y
   color. El ancho fija dónde salta la línea, no el tamaño de la tecla. */
.robot .label{
  font-size:54px;
  line-height:1.04;
  width:260px;
  text-align:center;
}

.house{--tint:var(--accent-house)}
.reloj{--tint:var(--accent-clock)}

.musica{--tint:var(--accent-music)}
.robot{--tint:var(--accent-robot)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Casa</h1>
    <p>Elige una pantalla</p>
  </div>
  <div class="clock">
    <time id="hora">--:--</time>
    <span id="fecha"></span>
  </div>
</header>

<main>

  <a class="card house" href="https://domotica.thempra.net/lovelace/home?kiosk">
    <span class="cap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.6 12 3l9 7.6"/>
        <path d="M5.5 9.3V20a1 1 0 0 0 1 1h4v-6.2h3V21h4a1 1 0 0 0 1-1V9.3"/>
      </svg>
      <span class="label">Domótica</span>
    </span>
  </a>

  <a class="card reloj" href="clock/index.html">
    <span class="cap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7.2V12l3.4 2.1"/>
      </svg>
      <span class="label">Reloj</span>
    </span>
  </a>

  <a class="card musica" href="https://open.spotify.com/intl-es">
    <span class="cap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M7.5 9.7c2.9-1.1 6.4-.9 9.1.7"/>
        <path d="M8.2 12.6c2.4-.9 5.3-.7 7.5.6"/>
        <path d="M8.9 15.4c1.9-.7 4.1-.6 6 .5"/>
      </svg>
      <span class="label">Música</span>
    </span>
  </a>

  <a class="card robot" href="http://192.168.50.131/">
    <span class="cap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5.2 11.8h13.6a2.8 2.8 0 0 1 2.8 2.8v1.2a2.6 2.6 0 0 1-2.6 2.6H5a2.6 2.6 0 0 1-2.6-2.6v-1.2a2.8 2.8 0 0 1 2.8-2.8Z"/>
        <path d="M9.2 11.8V10a2.8 2.8 0 0 1 5.6 0v1.8"/>
        <path d="M15.6 14.9h2.1"/>
      </svg>
      <span class="label">Robot de Limpieza</span>
    </span>
  </a>

</main>

<script>
(function () {
  var hora = document.getElementById('hora');
  var fecha = document.getElementById('fecha');
  var lastMinute = '';

  function tick() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var stamp = h + ':' + m;
    if (stamp !== lastMinute) {
      lastMinute = stamp;
      hora.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
      fecha.textContent = now.toLocaleDateString('es-ES', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
    }
  }

  tick();
  setInterval(tick, 10000);
})();
</script>
</body>
</html>
